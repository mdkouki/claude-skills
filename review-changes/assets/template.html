<title>Change Review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eef0f3; --border:#dbdee3;
    --text:#1c2128; --text-dim:#5c6470; --text-faint:#8891a0;
    --accent:#3454d1; --accent-soft:#e8ecfd;
    --add-bg:#e4f6e9; --add-text:#166534; --add-line:#c3ecd0;
    --del-bg:#fbe9ea; --del-text:#9f1d2c; --del-line:#f5cdd1;
    --warn:#b6690a; --warn-soft:#fdf0dd;
    --shadow: 0 1px 2px rgba(20,24,32,.06), 0 8px 24px rgba(20,24,32,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161a; --surface:#1b1e24; --surface-2:#22262e; --border:#31363f;
      --text:#eef0f3; --text-dim:#a4acb8; --text-faint:#727a87;
      --accent:#7f9cff; --accent-soft:#242c4a;
      --add-bg:#122f20; --add-text:#6cd393; --add-line:#1d4a30;
      --del-bg:#3a1418; --del-text:#f3808c; --del-line:#5c1d24;
      --warn:#e0a63d; --warn-soft:#3a2c12;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161a; --surface:#1b1e24; --surface-2:#22262e; --border:#31363f;
    --text:#eef0f3; --text-dim:#a4acb8; --text-faint:#727a87;
    --accent:#7f9cff; --accent-soft:#242c4a;
    --add-bg:#122f20; --add-text:#6cd393; --add-line:#1d4a30;
    --del-bg:#3a1418; --del-text:#f3808c; --del-line:#5c1d24;
    --warn:#e0a63d; --warn-soft:#3a2c12;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    font-size:14px; line-height:1.5;
  }
  code, .mono, .diff-line, .file-path{ font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; }

  .app{ display:flex; flex-direction:column; height:100%; min-height:100vh; }

  /* ---------- toolbar ---------- */
  .toolbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:12px 18px; background:var(--surface); border-bottom:1px solid var(--border);
    box-shadow:var(--shadow);
  }
  .toolbar h1{ font-size:15px; font-weight:700; margin:0; letter-spacing:.01em; }
  .toolbar .repo{ color:var(--text-faint); font-weight:500; }
  .stat{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-dim); }
  .stat b{ color:var(--text); font-weight:600; }
  .pill{ display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:99px; font-size:12px; font-weight:600; }
  .pill.add{ background:var(--add-bg); color:var(--add-text); }
  .pill.del{ background:var(--del-bg); color:var(--del-text); }
  .spacer{ flex:1; }
  .btn{
    appearance:none; border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    font:inherit; font-weight:600; font-size:12.5px; padding:7px 12px; border-radius:8px; cursor:pointer;
    transition:filter .12s ease, transform .05s ease;
  }
  .btn:hover{ filter:brightness(1.06); }
  .btn:active{ transform:translateY(1px); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.ghost-add{ background:var(--add-bg); border-color:var(--add-line); color:var(--add-text); }
  .btn.ghost-del{ background:var(--del-bg); border-color:var(--del-line); color:var(--del-text); }
  .btn:disabled{ opacity:.45; cursor:default; }
  .btn.small{ padding:4px 9px; font-size:11.5px; border-radius:6px; }

  /* ---------- layout ---------- */
  .body{ flex:1; display:flex; min-height:0; }
  .sidebar{
    width:280px; flex:0 0 280px; border-right:1px solid var(--border); background:var(--surface);
    overflow-y:auto; padding:10px 0;
  }
  .main{ flex:1; min-width:0; overflow-y:auto; padding:20px 24px 60px; }

  @media (max-width: 760px){
    .body{ flex-direction:column; }
    .sidebar{ width:100%; flex:0 0 auto; max-height:38vh; border-right:none; border-bottom:1px solid var(--border); }
  }

  /* ---------- file tree ---------- */
  .tree-item{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    padding:7px 14px; border:none; background:none; color:var(--text); font:inherit; font-size:12.8px;
    cursor:pointer; border-left:3px solid transparent;
  }
  .tree-item:hover{ background:var(--surface-2); }
  .tree-item.active{ background:var(--accent-soft); border-left-color:var(--accent); }
  .tree-item .type-badge{
    flex:0 0 16px; height:16px; width:16px; border-radius:4px; font-size:10px; font-weight:700;
    display:flex; align-items:center; justify-content:center; font-family:"IBM Plex Mono",monospace;
  }
  .type-badge.modified{ background:var(--warn-soft); color:var(--warn); }
  .type-badge.added{ background:var(--add-bg); color:var(--add-text); }
  .type-badge.deleted{ background:var(--del-bg); color:var(--del-text); }
  .tree-item .fname{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tree-item .fcounts{ flex:0 0 auto; font-size:11px; color:var(--text-faint); display:flex; gap:5px; }
  .tree-item .fcounts .a{ color:var(--add-text); } .tree-item .fcounts .d{ color:var(--del-text); }
  .tree-item .decision-dot{ flex:0 0 7px; width:7px; height:7px; border-radius:99px; background:var(--border); }
  .tree-item .decision-dot.accept{ background:var(--add-text); }
  .tree-item .decision-dot.reject{ background:var(--del-text); }
  .tree-item .decision-dot.partial{ background:var(--warn); }
  .sidebar-empty{ padding:24px 16px; color:var(--text-faint); font-size:13px; }

  /* ---------- file header ---------- */
  .file-header{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;
    padding-bottom:12px; border-bottom:1px solid var(--border);
  }
  .file-path{ font-size:14px; font-weight:600; word-break:break-all; }
  .view-toggle{ display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .view-toggle button{
    border:none; background:var(--surface); color:var(--text-dim); font:inherit; font-size:12px; font-weight:600;
    padding:6px 11px; cursor:pointer;
  }
  .view-toggle button.active{ background:var(--accent); color:#fff; }

  /* ---------- hunks ---------- */
  .hunk{
    display:grid; grid-template-columns:1fr 34px 1fr; gap:0; margin-bottom:16px;
    border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--surface);
    box-shadow:var(--shadow);
  }
  .hunk-side{ overflow-x:auto; }
  .hunk-side.old{ border-right:1px solid var(--border); }
  .hunk-toolbar{
    grid-column:1 / -1; display:flex; align-items:center; gap:8px; padding:6px 10px;
    background:var(--surface-2); border-bottom:1px solid var(--border); font-size:11.5px; color:var(--text-faint);
  }
  .hunk-toolbar .loc{ font-family:"IBM Plex Mono",monospace; }
  .hunk-toolbar .spacer{ flex:1; }
  .connector{
    display:flex; align-items:center; justify-content:center; background:var(--surface-2);
    border-right:1px solid var(--border); color:var(--text-faint);
  }
  .diff-line{
    display:flex; font-size:12.3px; white-space:pre; min-height:20px;
  }
  .diff-line .ln{
    flex:0 0 38px; text-align:right; padding:1px 8px; color:var(--text-faint); user-select:none;
    border-right:1px solid var(--border);
  }
  .diff-line .txt{ padding:1px 10px 1px 8px; overflow-x:visible; flex:1; }
  .diff-line.ctx .txt{ color:var(--text-dim); }
  .diff-line.del{ background:var(--del-bg); }
  .diff-line.del .txt{ color:var(--del-text); }
  .diff-line.add{ background:var(--add-bg); }
  .diff-line.add .txt{ color:var(--add-text); }
  .hunk.decided-reject .hunk-side.new .diff-line.add{ opacity:.35; }
  .hunk.decided-reject .hunk-side.old{ box-shadow: inset 0 0 0 2px var(--del-line); }
  .hunk.decided-accept .hunk-side.new{ box-shadow: inset 0 0 0 2px var(--add-line); }

  .full-file{
    border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--surface); box-shadow:var(--shadow);
  }
  .full-file .diff-line .ln{ flex:0 0 46px; }

  .banner{
    display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:10px;
    background:var(--accent-soft); color:var(--accent); font-size:12.8px; font-weight:600; margin-bottom:16px;
  }
  .banner.done{ background:var(--add-bg); color:var(--add-text); }

  .empty-state{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:60vh; color:var(--text-faint); gap:8px; }
  .empty-state svg{ opacity:.5; }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:99px; }

  /* ---------- review board additions ---------- */
  .tabs{ display:flex; gap:6px; padding:0 12px 10px; }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text); font:inherit; font-size:12.5px; font-weight:600;
    padding:8px 10px; border-radius:8px; cursor:pointer;
  }
  .tab.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .side-label{ padding:6px 14px 4px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); }
  .count{ font-size:11px; font-weight:600; color:var(--text-faint); }
  .count.warn{ color:var(--warn); }
  .tree-item .decision-dot.pending{ background:var(--warn); }

  .hunk.pending{ border-color:var(--warn); box-shadow:0 0 0 1px var(--warn), var(--shadow); }
  .card-head{ grid-column:1 / -1; padding:10px 12px 8px; border-bottom:1px solid var(--border); }
  .card-title{ font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .card-sub{ color:var(--text-dim); font-size:12.5px; margin-top:2px; }
  .card-sub code{ font-size:11.5px; color:var(--text-faint); }
  .chip{
    display:inline-flex; align-items:center; padding:1px 8px; border-radius:99px; font-size:11px; font-weight:600;
    background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border);
  }
  .chip.accept{ background:var(--add-bg); color:var(--add-text); border-color:var(--add-line); }
  .chip.reject{ background:var(--del-bg); color:var(--del-text); border-color:var(--del-line); }
  .chip.pending, .chip.important, .chip.override{ background:var(--warn-soft); color:var(--warn); border-color:transparent; }
  .chip.r-behavior{ background:var(--accent-soft); color:var(--accent); border-color:transparent; }
  .chip.r-architecture{ background:#efe6fb; color:#6b3fb0; border-color:transparent; }
  .chip.r-side-effect{ background:var(--del-bg); color:var(--del-text); border-color:transparent; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip.r-architecture{ background:#2d2245; color:#b79bee; } }
  :root[data-theme="dark"] .chip.r-architecture{ background:#2d2245; color:#b79bee; }

  .minor-row{
    display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:start; margin-bottom:10px;
    padding:10px 12px; border:1px solid var(--border); border-left:4px solid var(--add-text); border-radius:10px;
    background:var(--surface);
  }
  .minor-row.rej{ border-left-color:var(--del-text); }
  .minor-actions{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .llm-verdict{ font-size:12px; color:var(--text-faint); margin-top:4px; }
  .minor-diff{ grid-column:1 / -1; }
  .minor-diff summary{ cursor:pointer; font-size:12px; font-weight:600; color:var(--accent); }
  .minor-diff .loc{ font-family:"IBM Plex Mono",monospace; color:var(--text-faint); font-weight:400; margin-left:6px; }
  .hunk.plain{ margin:8px 0 0; box-shadow:none; }

  #overlay{ position:fixed; inset:0; z-index:50; background:var(--bg); overflow-y:auto; padding:32px 16px; }
  .overlay-inner{ max-width:980px; margin:0 auto; }
  .overlay-inner h2{ margin:0 0 4px; font-size:22px; }
  .dim{ color:var(--text-dim); }
</style>

<div class="app">
  <div class="toolbar">
    <h1>Change Review Board <span class="repo" id="repoName"></span></h1>
    <div class="stat" id="fileCountStat"></div>
    <div class="stat"><span class="pill add" id="addPill"></span><span class="pill del" id="delPill"></span></div>
    <div class="spacer"></div>
    <button class="btn ghost-add small" id="acceptAllBtn">Approve all important</button>
    <button class="btn ghost-del small" id="rejectAllBtn">Reject all important</button>
    <button class="btn primary" id="submitBtn">Submit review</button>
  </div>

  <div class="body">
    <div class="sidebar" id="sidebar"></div>
    <div class="main" id="main"></div>
  </div>
</div>

<script>
(function(){
  // ---- data injected by the skill at build time ----
  const DATA = window.__REVIEW_DATA__ || {generatedAt:"", repo:"", files:[]};

  // ---- one "item" per hunk (modified files) or per whole file (added/deleted) ----
  const ITEMS = [];
  DATA.files.forEach(f => {
    if (f.binary || f.error) return;
    if (f.changeType === "added" || f.changeType === "deleted"){
      ITEMS.push({ key:f.path, ident:"file", f, h:null, cls: f.cls || fallbackCls(f.path) });
    } else {
      f.hunks.forEach(h => ITEMS.push({ key:f.path + "::" + h.id, ident:h.id, f, h, cls: h.cls || fallbackCls(f.path + " " + h.id) }));
    }
  });
  function fallbackCls(title){
    return { importance:"important", reasons:["unclassified"], title, rationale:"Not classified — needs a human look." };
  }

  const state = {
    view: ITEMS.some(i => i.cls.importance === "important") ? "important" : (ITEMS.length ? "minor" : "files"),
    activePath: DATA.files[0] ? DATA.files[0].path : null,
    fileMode: {},   // path -> 'hunks' | 'full'
    user: {},       // item key -> 'accept' | 'reject'  (explicit user decisions only)
    expanded: {},   // item key -> bool (minor rows: diff open)
    phase: "review" // 'review' | 'done'
  };

  function esc(s){
    return (s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  }
  function fileByPath(p){ return DATA.files.find(f => f.path === p); }
  function isImportant(it){ return it.cls.importance === "important"; }

  // user decision beats the LLM's; an important item with neither is pending (null)
  function decisionOf(it){
    if (state.user[it.key]) return state.user[it.key];
    return isImportant(it) ? null : it.cls.llmDecision;
  }
  function byOf(it){ return state.user[it.key] ? "user" : "llm"; }
  function pendingImportant(){ return ITEMS.filter(i => isImportant(i) && !decisionOf(i)); }

  function fileStatus(f){
    const its = ITEMS.filter(i => i.f === f);
    if (!its.length) return "accept";
    const ds = its.map(decisionOf);
    if (ds.some(d => !d)) return "pending";
    if (ds.every(d => d === "accept")) return "accept";
    if (ds.every(d => d === "reject")) return "reject";
    return "partial";
  }

  // ---------- diff rendering ----------
  function renderSide(lines, side){
    if (!lines.length) return '<div class="diff-line ctx"><span class="ln"></span><span class="txt">&nbsp;</span></div>';
    return lines.map(l => {
      const cls = l.type === "ctx" ? "ctx" : (side === "old" ? "del" : "add");
      return `<div class="diff-line ${cls}"><span class="ln">${l.ln}</span><span class="txt">${esc(l.text) || "&nbsp;"}</span></div>`;
    }).join("");
  }
  function itemHunks(it){ return it.h ? [it.h] : it.f.hunks; }
  function sidesHtml(it){
    const hs = itemHunks(it);
    const old = hs.flatMap(h => h.old), nw = hs.flatMap(h => h.new);
    return `<div class="hunk-side old">${renderSide(old, "old")}</div>
      <div class="connector">&#8594;</div>
      <div class="hunk-side new">${renderSide(nw, "new")}</div>`;
  }
  function locOf(it){
    if (it.h) return `@@ -${it.h.oldStart},${it.h.oldLines} +${it.h.newStart},${it.h.newLines} @@`;
    return it.f.changeType === "added" ? "new file" : "deleted file";
  }
  function decBtns(it, cur){
    const own = state.user[it.key];
    return `<button class="btn small ${cur==='accept'?'ghost-add':''}" data-act="accept" data-key="${esc(it.key)}">Approve</button>
      <button class="btn small ${cur==='reject'?'ghost-del':''}" data-act="reject" data-key="${esc(it.key)}">Reject</button>
      ${own && !isImportant(it) ? `<button class="btn small" data-act="reset" data-key="${esc(it.key)}" title="Go back to Claude's decision">&#8634; Claude</button>` : ""}`;
  }
  function chips(it){
    return isImportant(it) ? it.cls.reasons.map(r => `<span class="chip r-${r}">${esc(r)}</span>`).join("") : "";
  }

  // important item: full side-by-side card, blocks Submit until decided
  function renderImportant(it, showPath){
    const cur = decisionOf(it);
    const cls = cur === "accept" ? "decided-accept" : cur === "reject" ? "decided-reject" : "pending";
    return `<div class="hunk ${cls}">
      <div class="card-head">
        <div class="card-title">${esc(it.cls.title)} ${chips(it)}${cur ? "" : '<span class="chip pending">needs your decision</span>'}</div>
        <div class="card-sub">${showPath ? `<code>${esc(it.f.path)}</code> · ` : ""}${esc(it.cls.rationale)}</div>
      </div>
      <div class="hunk-toolbar">
        <span class="loc">${locOf(it)}</span><span class="spacer"></span>${decBtns(it, cur)}
      </div>
      ${sidesHtml(it)}
    </div>`;
  }

  // minor item: compact row with Claude's pre-decision, diff on demand
  function renderMinor(it, showPath){
    const cur = decisionOf(it), by = byOf(it);
    const flipped = by === "user" && cur !== it.cls.llmDecision;
    return `<div class="minor-row ${cur === 'reject' ? 'rej' : 'acc'}">
      <div class="minor-main">
        <div class="card-title">${esc(it.cls.title)}
          <span class="chip ${cur}">${cur === "accept" ? "approved" : "rejected"} by ${by === "user" ? "you" : "Claude"}</span>
          ${flipped ? '<span class="chip override">override</span>' : ""}
        </div>
        <div class="card-sub">${showPath ? `<code>${esc(it.f.path)}</code> · ` : ""}${esc(it.cls.rationale)}</div>
        <div class="llm-verdict">Claude's call: <b>${it.cls.llmDecision}</b>${it.cls.llmWhy ? " — " + esc(it.cls.llmWhy) : ""}</div>
      </div>
      <div class="minor-actions">${decBtns(it, cur)}</div>
      <details class="minor-diff" data-key="${esc(it.key)}" ${state.expanded[it.key] ? "open" : ""}>
        <summary>Show diff <span class="loc">${locOf(it)}</span></summary>
        <div class="hunk plain">${sidesHtml(it)}</div>
      </details>
    </div>`;
  }

  function renderFullFile(f){
    const oldLines = (f.oldContent || "").split("\n");
    const newLines = (f.newContent || "").split("\n");
    const mk = ls => ls.map((t,i) => `<div class="diff-line ctx"><span class="ln">${i+1}</span><span class="txt">${esc(t)||"&nbsp;"}</span></div>`).join("");
    return `<div class="full-file" style="display:grid;grid-template-columns:1fr 34px 1fr;">
      <div class="hunk-side old">${mk(oldLines)}</div>
      <div class="connector" style="grid-row:1;">&#8594;</div>
      <div class="hunk-side new">${mk(newLines)}</div>
    </div>`;
  }

  // ---------- sidebar ----------
  function renderSidebar(){
    const el = document.getElementById("sidebar");
    const imp = ITEMS.filter(isImportant), min = ITEMS.filter(i => !isImportant(i));
    const pend = pendingImportant().length;
    const tabs = `<div class="tabs">
      <button class="tab ${state.view==='important'?'active':''}" data-view="important">Important <span class="count ${pend?'warn':''}">${pend ? pend + " to decide" : imp.length}</span></button>
      <button class="tab ${state.view==='minor'?'active':''}" data-view="minor">Minor <span class="count">${min.length}</span></button>
    </div><div class="side-label">Files</div>`;
    if (!DATA.files.length){
      el.innerHTML = tabs + '<div class="sidebar-empty">No uncommitted changes found.</div>';
    } else {
      el.innerHTML = tabs + DATA.files.map(f => {
        const badge = f.changeType === "added" ? "A" : f.changeType === "deleted" ? "D" : "M";
        const nImp = ITEMS.filter(i => i.f === f && isImportant(i)).length;
        return `<button class="tree-item ${state.view==='files' && f.path===state.activePath?'active':''}" data-path="${esc(f.path)}">
          <span class="type-badge ${f.changeType}">${badge}</span>
          <span class="fname" title="${esc(f.path)}">${esc(f.path)}</span>
          ${nImp ? `<span class="count warn" title="important changes">${nImp}!</span>` : ""}
          <span class="fcounts">${f.additions?`<span class="a">+${f.additions}</span>`:''}${f.deletions?`<span class="d">-${f.deletions}</span>`:''}</span>
          <span class="decision-dot ${fileStatus(f)}"></span>
        </button>`;
      }).join("");
    }
    el.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => { state.view = b.dataset.view; renderAll(); }));
    el.querySelectorAll(".tree-item").forEach(b => b.addEventListener("click", () => { state.activePath = b.dataset.path; state.view = "files"; renderAll(); }));
  }

  // ---------- main ----------
  function renderMain(){
    const el = document.getElementById("main");
    let html = "";
    if (state.view === "important"){
      const list = ITEMS.filter(isImportant);
      html = `<div class="banner">Changes that alter behavior, architecture or have side effects — these are yours to decide.</div>`
        + (list.length ? list.map(i => renderImportant(i, true)).join("") : `<div class="empty-state"><span>Nothing important in this change set.</span></div>`);
    } else if (state.view === "minor"){
      const list = ITEMS.filter(i => !isImportant(i));
      html = `<div class="banner">Pre-reviewed by Claude. Leave them alone to keep Claude's call, or override any of them — your click wins in either direction.</div>`
        + (list.length ? list.map(i => renderMinor(i, true)).join("") : `<div class="empty-state"><span>No minor changes.</span></div>`);
    } else {
      const f = fileByPath(state.activePath);
      if (!f){ el.innerHTML = `<div class="empty-state"><span>Select a file on the left</span></div>`; return; }
      const mode = state.fileMode[f.path] || "hunks";
      let body;
      if (f.binary || f.error){
        body = `<div class="banner">Binary or unreadable file — no inline diff, and it is left untouched by this review.</div>`;
      } else if (mode === "full"){
        body = renderFullFile(f);
      } else {
        const its = ITEMS.filter(i => i.f === f);
        body = its.length ? its.map(i => isImportant(i) ? renderImportant(i, false) : renderMinor(i, false)).join("") : `<div class="banner">No textual changes.</div>`;
      }
      html = `<div class="file-header">
          <span class="file-path">${esc(f.path)}</span><span class="spacer"></span>
          <div class="view-toggle">
            <button data-mode="hunks" class="${mode==='hunks'?'active':''}">Changed only</button>
            <button data-mode="full" class="${mode==='full'?'active':''}">Full file</button>
          </div></div>` + body;
    }
    el.innerHTML = html;

    el.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => { state.fileMode[state.activePath] = b.dataset.mode; renderAll(); }));
    el.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => {
      if (b.dataset.act === "reset") delete state.user[b.dataset.key];
      else state.user[b.dataset.key] = b.dataset.act;
      const y = document.getElementById("main").scrollTop;
      renderAll();
      document.getElementById("main").scrollTop = y;
    }));
    el.querySelectorAll("details.minor-diff").forEach(d => d.addEventListener("toggle", () => { state.expanded[d.dataset.key] = d.open; }));
  }

  function renderStats(){
    document.getElementById("repoName").textContent = DATA.repo ? "· " + DATA.repo : "";
    const imp = ITEMS.filter(isImportant).length;
    const pend = pendingImportant().length;
    document.getElementById("fileCountStat").innerHTML =
      `<b>${DATA.files.length}</b> file${DATA.files.length===1?'':'s'} · <b>${imp}</b> important · <b>${ITEMS.length - imp}</b> minor`;
    document.getElementById("addPill").textContent = "+" + DATA.files.reduce((s,f)=>s+f.additions,0);
    document.getElementById("delPill").textContent = "-" + DATA.files.reduce((s,f)=>s+f.deletions,0);
    const btn = document.getElementById("submitBtn");
    btn.disabled = pend > 0 || state.phase !== "review";
    btn.title = pend ? `${pend} important change${pend===1?'':'s'} still need your decision` : "";
    btn.textContent = pend ? `Submit (${pend} left)` : "Submit review";
  }

  function setAllImportant(decision){
    ITEMS.filter(isImportant).forEach(i => { state.user[i.key] = decision; });
    renderAll();
  }

  // ---------- phase 1: submit ----------
  function buildDecisions(){
    const files = {};
    DATA.files.forEach(f => {
      if (f.binary || f.error) return;
      const entry = { file: "accept", hunks: {}, decidedBy: {} };
      ITEMS.filter(i => i.f === f).forEach(i => {
        const d = decisionOf(i) || "accept";
        entry.decidedBy[i.ident] = byOf(i);
        if (i.ident === "file") entry.file = d; else entry.hunks[i.ident] = d;
      });
      files[f.path] = entry;
    });
    return { files, submittedAt: new Date().toISOString() };
  }

  function showOverlay(html){
    let o = document.getElementById("overlay");
    if (!o){ o = document.createElement("div"); o.id = "overlay"; document.body.appendChild(o); }
    o.innerHTML = `<div class="overlay-inner">${html}</div>`;
    return o;
  }

  async function submit(){
    if (pendingImportant().length) return;
    try{
      const res = await fetch("/submit", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(buildDecisions()) });
      if (!res.ok) throw new Error("server responded " + res.status);
    } catch(e){
      alert("Couldn't reach the local review server (" + e.message + "). Is it still running?");
      return;
    }
    state.phase = "done";
    renderStats();
    showOverlay(`<h2>Review submitted</h2><p class="dim">Go back to Claude &mdash; the decision table and the final green/red light are waiting in the terminal. You can close this tab.</p>`);
    // acknowledge so the server can exit only after this page has its response
    try { await fetch("/bye", { method:"POST", headers:{"Content-Type":"application/json"}, body:"{}" }); } catch(e){}
    window.close(); // works when the browser allows it; otherwise the message above stays
  }

  function renderAll(){ renderStats(); renderSidebar(); renderMain(); }

  document.getElementById("acceptAllBtn").addEventListener("click", () => setAllImportant("accept"));
  document.getElementById("rejectAllBtn").addEventListener("click", () => setAllImportant("reject"));
  document.getElementById("submitBtn").addEventListener("click", submit);

  renderAll();
})();
</script>
